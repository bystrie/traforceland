<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переход...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #f5f5f5;
      color: #333;
    }
    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 32px;
      background: #0088cc;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
    }
    .btn:active { opacity: 0.85; }
  </style>
</head>
<body>

  <h2>Открываем ссылку...</h2>
  <p>Если автоматически не открылось — нажми кнопку ниже</p>
  
  <a id="btn" class="btn" href="#">Открыть во внешнем браузере</a>

  <script>
    // ===== СЮДА ВПИШИ КОНЕЧНЫЙ АДРЕС =====
    const targetUrl = "https://google.com";
    // =====================================

    document.getElementById("btn").href = targetUrl;

    function isTelegramWebView() {
      return !!(
        window.TelegramWebview ||
        window.TelegramWebviewProxy ||
        /Telegram/i.test(navigator.userAgent)
      );
    }

    function openExternal() {
      // Android — самый рабочий способ
      if (/Android/i.test(navigator.userAgent)) {
        const cleanUrl = targetUrl.replace(/^https?:\/\//, "");
        const intentUrl = `intent://${cleanUrl}#Intent;scheme=https;end`;
        window.location.href = intentUrl;
        return;
      }

      // iOS и остальные
      window.location.href = targetUrl;
    }

    // Если мы внутри Telegram — пытаемся выкинуть наружу
    if (isTelegramWebView()) {
      openExternal();

      // Повторная попытка через 700 мс (иногда помогает)
      setTimeout(openExternal, 700);
    } else {
      // Если уже не в телеге — просто редиректим
      window.location.replace(targetUrl);
    }
  </script>

</body>
</html>
