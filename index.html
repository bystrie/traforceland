<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открыть в браузере</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 350px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .btn {
            display: block;
            padding: 16px 20px;
            background: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Переход на сайт</h2>
    <p>Нажмите на кнопку ниже, чтобы открыть страницу в основном браузере смартфона.</p>
    
    <!-- Ссылка оформлена как скачивание файла -->
    <a id="open-btn" class="btn" download="redirect.html" href="#">ОТКРЫТЬ В БРАУЗЕРЕ</a>
</div>

<script>
    // ⚠️ ВПИШИТЕ СЮДА ВАШ ЦЕЛЕВОЙ САЙТ (ОБЯЗАТЕЛЬНО С HTTPS://)
    const targetUrl = "https://google.com"; 

    // Генерируем HTML-код для скачиваемого файла-прокладки
    const redirectHtml = 
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Перенаправление...</title>
            <script>window.location.href = "${targetUrl}";<\/script>
        </head>
        <body>Перенаправление...</body>
        </html>
    ;

    // Переводим HTML в base64 формат, имитирующий скачивание файла
    const base64Html = btoa(unescape(encodeURIComponent(redirectHtml)));
    const downloadDataUri = "data:attachment/html;base64," + base64Html;

    // Присваиваем кнопке
    document.getElementById('open-btn').href = downloadDataUri;
</script>

</body>
</html>
