<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление...</title>
    <script>
        window.onload = function() {
            // Ссылка на твой целевой оффер / смартлинку
            var targetUrl = "https://your-offer-link.com/path";

            var userAgent = navigator.userAgent  navigator.vendor  window.opera;

            // Проверяем, находится ли пользователь во внутреннем браузере Telegram
            if (userAgent.indexOf("Telegram") > -1) {

                // Для Android: используем intent со специальным fallback
                if (/android/i.test(userAgent)) {
                    var cleanUrl = targetUrl.replace(/^https?:\/\//, '');
                    window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
                } 
                // Для iOS (iPhone): используем редирект через файл/схему или вызов Safari
                else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    window.location.href = targetUrl; // iOS Safari подхватывает внешний переход
                } else {
                    window.location.href = targetUrl;
                }
            } else {
                // Если пользователь уже во внешнем браузере — просто делаем редирект
                window.location.href = targetUrl;
            }
        };
    </script>
</head>
<body style="background:#f4f4f4; font-family:sans-serif; text-align:center; padding-top:20%;">
    <p>Загрузка безопасного соединения...</p>
    <p>Если страница не открылась, <a id="manual-link" href="#">нажмите сюда</a>.</p>
    <script>
        document.getElementById('manual-link').href = "https://google.com";
    </script>
</body>
</html>
