<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открыть в браузере</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        h2 { font-size: 20px; margin: 0 0 12px 0; color: #111; }
        p { font-size: 14px; color: #666; margin: 0 0 24px 0; line-height: 1.5; }
        
        /* Инструкция со стрелочками */
        .instruction {
            background: #f8f9fb;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #475569;
            text-align: left;
        }
        .instruction ol { margin: 0; padding-left: 20px; }
        .instruction li { margin-bottom: 6px; }

        .btn-copy {
            display: block;
            width: 100%;
            padding: 14px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn-copy:active { background: #006699; }
    </style>
</head>
<body>

<div class="card">
    <h2>Открыть во внешнем браузере</h2>
    <p>Встроенный браузер Telegram может ограничивать работу сайта.</p>
    
    <!-- Динамическая инструкция под Android/iOS -->
    <div class="instruction">
        <ol id="steps">
            <li>Нажмите на <b>три точки</b> (или стрелочку) в верхнем углу экрана.</li>
            <li>Выберите <b>«Открыть в браузере»</b> (или Safari/Chrome).</li>
        </ol>
    </div>

    <button id="copy-btn" class="btn-copy">Скопировать ссылку на сайт</button>
</div>

<script>
    // ⚠️ ВСТАВЬТЕ СЮДА ВАШ ИТОГОВЫЙ САЙТ С HTTPS://
    const realWebsiteUrl = "https://google.com"; 

    // Адаптируем текст под iOS / Android
    const steps = document.getElementById('steps');
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        steps.innerHTML = 
            <li>Нажмите на иконку <b>safari</b> или <b>три точки (...)</b> внизу/вверху экрана.</li>
            <li>Выберите <b>«Открыть в Safari»</b>.</li>
        ;
    }

    // Логика кнопки «Скопировать» как запасной вариант
    document.getElementById('copy-btn').addEventListener('click', function() {
        navigator.clipboard.writeText(realWebsiteUrl).then(() => {
            this.innerText = "✓ Ссылка скопирована!";
            this.style.background = "#10b981";
            setTimeout(() => {
                this.innerText = "Скопировать ссылку на сайт";
                this.style.background = "#0088cc";
            }, 2000);
        }).catch(() => {
            alert("Пожалуйста, скопируйте адрес вручную или откройте через меню сверху.");
        });
    });
</script>

</body>
</html>
