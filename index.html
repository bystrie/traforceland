<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Открыть в браузере</title>
  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 15px;
    }
    .desc {
      color: #aaa;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 30px;
      max-width: 320px;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 320px;
      padding: 18px;
      background: #0088cc;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .btn:active { opacity: 0.85; }
    .hint {
      margin-top: 25px;
      font-size: 14px;
      color: #666;
      max-width: 300px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>Ссылка открылась внутри Telegram</h1>
  <div class="desc">
    Чтобы открыть нормально — нажми кнопку ниже<br>
    или долгий тап по ссылке → «Открыть в браузере»
  </div>

  <a id="openBtn" class="btn" href="#">Открыть во внешнем браузере</a>

  <div class="hint">
    Если кнопка не помогает — зажми ссылку в посте Telegram и выбери «Открыть в браузере»
  </div>

  <script>
    // ===== ТВОЙ АДРЕС =====
    const TARGET = "https://google.com";
    // =====================

    const btn = document.getElementById("openBtn");
    btn.href = TARGET;

    // Пробуем всё возможное при загрузке (на всякий случай)
    if (/Android/i.test(navigator.userAgent)) {
      const clean = TARGET.replace(/^https?:\/\//, "");
      
      // несколько попыток
      setTimeout(() => {
        window.location.href = `intent://${clean}#Intent;scheme=https;package=com.android.chrome;end`;
      }, 300);
      
      setTimeout(() => {
        window.location.href = `intent://${clean}#Intent;scheme=https;action=android.intent.action.VIEW;end`;
      }, 800);
    }
  </script>

</body>
</html>
