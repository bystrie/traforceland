<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открыть в внешнем браузере</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { font-size: 20px; margin-bottom: 10px; color: #111; }
        p { font-size: 14px; color: #666; margin-bottom: 25px; line-height: 1.4; }
        .btn {
            display: block;
            padding: 16px 24px;
            background: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:active { background: #006699; }
    </style>
</head>
<body>

<div class="container">
    <h2>Переход на внешний сайт</h2>
    <p>Для корректной работы нажмите на кнопку ниже, чтобы открыть страницу в обычном браузере смартфона.</p>
    
    <!-- Кнопка перехода -->
    <a id="open-btn" class="btn" href="#">ОТКРЫТЬ В БРАУЗЕРЕ</a>
</div>

<script>
    // ⚠️ УКАЖИТЕ ЗДЕСЬ СВОЙ ЦЕЛЕВОЙ САЙТ (БЕЗ https://)
    const domain = "://google.com"; 
    
    const fullUrl = "https://" + domain;
    const btn = document.getElementById('open-btn');

    // Определяем операционную систему
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isAndroid) {
        // Жесткий интент для Android: принудительно открывает Chrome или дефолтный браузер
        btn.href = intent://${domain}#Intent;scheme=https;end;;
    } else if (isIOS) {
        // Для iOS: используем костыль с FTP. Telegram WebView не умеет в FTP 
        // и сбрасывает ссылку в системный Safari, который уже открывает её нормально.
        btn.href = "ftp://" + domain;
        
        // Альтернативный вариант для iOS, если FTP не сработает на вашем домене:
        // На iOS отлично работают ссылки-прокладки вроде тех, что генерирует бесплатный https://lnkiy.in
        // Если кнопка на iPhone будет выдавать ошибку, замените строку выше на:
        // btn.href = fullUrl; btn.target = "_blank";
    } else {
        // Для ПК и остальных устройств
        btn.href = fullUrl;
    }
</script>

</body>
</html>
