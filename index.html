<?php
// Твоя ссылка на оффер / смартлинку
$targetUrl = "https://google.com";

$userAgent = $_SERVER['HTTP_USER_AGENT'];

// Проверяем, зашел ли пользователь из Telegram
if (strpos($userAgent, 'Telegram') !== false) {
    // Принудительно отдаем заголовок скачивания файла. 
    // Telegram WebView не умеет открывать бинарные файлы внутри себя 
    // и НАПРОЧЬ сбрасывает сессию во внешний браузер (Safari/Chrome).
    header('Content-Type: application/octet-stream');
    header('Content-Disposition: attachment; filename="go.html"');
    
    // Внутри файла отдаем мгновенный мета-рефреш
    echo '<!DOCTYPE html><html><head>';
    echo '<meta http-equiv="refresh" content="0;url='.$targetUrl.'">';
    echo '</head><body>';
    echo '<script>window.location.replace("'.$targetUrl.'");</script>';
    echo '</body></html>';
    exit();
} else {
    // Если юзер уже во внешнем браузере — мгновенно отправляем на оффер
    header("Location: " . $targetUrl, true, 302);
    exit();
}
?>
