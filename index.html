<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Открываем...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #0f0f0f;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h2 { margin: 0 0 12px; font-size: 22px; }
    p { color: #aaa; margin: 0 0 30px; font-size: 15px; }
    .btn {
      display: block;
      width: 100%;
      max-width: 320px;
      padding: 18px 24px;
      background: #0088cc;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .btn.secondary {
      background: #222;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

  <h2>Открываем ссылку</h2>
  <p>Если не открылось автоматически — нажми кнопку</p>

  <a id="mainBtn" class="btn" href="#">Открыть во внешнем браузере</a>
  <a id="chromeBtn" class="btn secondary" href="#">Открыть в Chrome</a>

  <script>
    // ===== СЮДА СВОЙ АДРЕС =====
    const TARGET = "https://google.com";
    // ==========================

    const mainBtn = document.getElementById("mainBtn");
    const chromeBtn = document.getElementById("chromeBtn");

    mainBtn.href = TARGET;
    chromeBtn.href = TARGET;

    function isTelegram() {
      return !!(
        window.TelegramWebview ||
        window.TelegramWebviewProxy ||
        window.TelegramGameProxy ||
        /Telegram/i.test(navigator.userAgent)
      );
    }

    function tryOpenExternal() {
      if (!/Android/i.test(navigator.userAgent)) {
        window.location.href = TARGET;
        return;
      }

      const clean = TARGET.replace(/^https?:\/\//, "");

      // Вариант 1 — самый полный intent
      const intent1 = `intent://${clean}#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end`;
      
      // Вариант 2 — принудительно Chrome
      const intent2 = `intent://${clean}#Intent;scheme=https;package=com.android.chrome;end`;

      // Вариант 3 — через создание ссылки и клик (иногда проходит лучше)
      function clickLink(url) {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // Пробуем по очереди
      try {
        window.location.href = intent1;
      } catch (e) {}

      setTimeout(() => {
        try { window.location.href = intent2; } catch (e) {}
      }, 400);

      setTimeout(() => {
        clickLink(intent1);
      }, 800);

      setTimeout(() => {
        clickLink(intent2);
      }, 1200);
    }

    // Кнопки тоже используют intent
    mainBtn.addEventListener("click", function(e) {
      e.preventDefault();
      tryOpenExternal();
      // запасной обычный переход через 1.5 сек
      setTimeout(() => { window.location.href = TARGET; }, 1500);
    });

    chromeBtn.addEventListener("click", function(e) {
      e.preventDefault();
      const clean = TARGET.replace(/^https?:\/\//, "");
      window.location.href = `intent://${clean}#Intent;scheme=https;package=com.android.chrome;end`;
    });

    // Автоматическая попытка при загрузке
    if (isTelegram()) {
      tryOpenExternal();
    } else {
      window.location.replace(TARGET);
    }
  </script>

</body>
</html>
